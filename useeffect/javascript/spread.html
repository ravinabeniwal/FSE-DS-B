<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // spread is use to create a new array from existing array without changing the existing array 
        const num=[1,2,3,4];
        const n=[...num,5,6];
        document.write(num+""+"<br>");
        document.write(n+" ");
    </script>
</body>
</html>
