<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        const arr=["1","2","3","4","5"];
         let len=arr.length;
        let text=" ";
        for(let i=0;i<len;i++){
            if(i==1 || i==3)
            text+=arr[i]+"<br>";
           
        }
         document.getElementById("demo").innerHTML=text;
    </script>
</body>
</html>
